name: Release Please

# Runs as the cyvore-release-bot App: GITHUB_TOKEN can't open PRs here, and a tag it
# creates fires no downstream workflow (no image build, no release notes).

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: release-please-config.json
      manifest-file:
        type: string
        default: .release-please-manifest.json

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # release-please names it "v<version>" even with include-v-in-tag: false.
      - name: Name the release after its tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG"

  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: Cyvore/.github/.github/workflows/publish-release-notes.yaml@main
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
