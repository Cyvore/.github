name: Trivy

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      # fs scan only: dependencies, committed secrets, Dockerfile/IaC misconfig.
      # A repo can waive an unfixable finding in its own .trivyignore.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          # Pinned: the action's default install has been failing in CI.
          version: v0.74.0
