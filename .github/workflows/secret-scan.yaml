name: Secret Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan
        env:
          # Pinned by digest, no runtime download: the action's binary fetch 504'd org-wide.
          GITLEAKS: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f   # v8.30.1
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Only the new commits, like gitleaks-action; a repo's .gitleaks.toml is picked up from /repo.
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            # New branch or force push: scan what the branch adds over the default branch.
            range="origin/$DEFAULT_BRANCH..$AFTER"
          fi
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo" "$GITLEAKS" git /repo \
            --no-banner --redact --verbose \
            --log-opts="--no-merges --first-parent $range"
