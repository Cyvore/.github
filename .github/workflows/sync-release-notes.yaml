name: Sync Release Notes Caller

on:
  # Schedule paused 2026-08-19. GH_ORG_PAT is expired, so every run since at least
  # 6 August died at `git clone` with "could not read Password" — 14 consecutive
  # red mornings reporting a problem nobody could act on from the failure alone.
  # Re-enable once the PAT is replaced (classic, repo scope, SAML-authorised for
  # the org), then dispatch once manually to confirm the sync actually lands.
  # schedule:
  #   - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync release-notes caller to org repos
        uses: BetaHuhn/repo-file-sync-action@v1
        env:
          GH_PAT: ${{ secrets.GH_ORG_PAT }}
          CONFIG_PATH: .github/sync.yml
          SKIP_PR: true
          COMMIT_PREFIX: "ci:"
          COMMIT_BODY: "Adds release notes caller workflow — auto-synced from cyvore/.github"
